<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>網路銀行轉帳系統</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>
<body>

  <!-- ✅ 所有畫面都顯示在這個容器 -->
  <div id="app"></div>

<script>
/* ========= 登入畫面 ========= */
function showLogin() {
  document.getElementById("app").innerHTML = `
    <div class="loginContainer">
      <h2>網路銀行登入</h2>
      <input type="text" id="username" placeholder="帳號">
      <input type="password" id="password" placeholder="密碼">
      <button class="loginButton" onclick="login()">Login</button>
    </div>
  `;
}

/* ========= 登入 API ========= */
function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  fetch('/api/login/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ username, password })
  })
  .then(response => {
    if (!response.ok) {
      return response.json().then(data => { throw new Error(data.detail); });
    }
    return response.json();
  })
  .then(data => {
    localStorage.setItem('Token', data.token);
    loadMenu();   // ✅ 不跳頁，直接載入主畫面
  })
  .catch(error => {
    alert(`登入失敗：${error.message}`);
  });
}

/* ========= 載入主選單畫面 ========= */
function loadMenu() {
  fetch('/menu/')
    .then(res => res.text())
    .then(html => {
      document.getElementById("app").innerHTML = html;
    });
}

/* ========= 載入其他頁面 ========= */
function loadBalance() {
  fetch('/balance/')
    .then(res => res.text())
    .then(html => document.getElementById("app").innerHTML = html);
}

function loadTransaction() {
  fetch('/transaction/')
    .then(res => res.text())
    .then(html => document.getElementById("app").innerHTML = html);
}

function loadTransfer() {
  fetch('/transfer/')
    .then(res => res.text())
    .then(html => document.getElementById("app").innerHTML = html);
}

function logout() {
  localStorage.removeItem("Token");
  showLogin();
}

/* ========= 頁面一進來就先顯示登入 ========= */
showLogin();
</script>

</body>
</html>
